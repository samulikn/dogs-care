<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
    rel="stylesheet">
  <link href="./src/index.css" rel="stylesheet">
  <title>Dogs care questionnaire</title>
</head>

<body class="w-full min-h-full bg-background">
  <form name="dogs-questionnaire" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="dogsname" required />
    <input type="text" name="age" />
    <input type="number" name="mealsPerDay" />
    <input type="text" name="meals" />
    <input type="text" name="portion 1" />
    <input type="text" name="portion 2" />
    <input type="text" name="portion 3" />
    <input type="text" name="portion 4" />
    <input type="radio" name="activity" />
    <input type="checkbox" name="favoriteActivity" />
    <input type="number" name="walksPerDay" />
    <input type="text" name="walks" />
    <input type="radio" name="social" />
    <textarea name="addinfo"></textarea>
    <input name="bot-field" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
